# ReAI Open: dedicated read-only static site. No API or account proxy.
server {
    listen 80;
    listen [::]:80;
    server_name open.reai.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name open.reai.com;
    ssl_certificate /etc/letsencrypt/live/open.reai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open.reai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/open.reai.com/current;
    index index.html;
    autoindex off;
    access_log /var/log/nginx/open.reai.com.access.log;
    error_log /var/log/nginx/open.reai.com.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://block2-api.wainao.chat; connect-src 'self' https://block2-api.wainao.chat; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    error_page 404 /404.html;
    location = /en { return 301 /en/; }
    location = /docs { return 301 /docs/; }
    location = /docs/en { return 301 /docs/en/; }
    location /docs/en/ {
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /en/404.html;
    }
    location /docs/ { try_files $uri $uri.html $uri/index.html =404; }
    location /en/ {
        try_files $uri $uri/index.html =404;
        error_page 404 /en/404.html;
    }
    # Only syntactically valid app IDs use the runtime public-catalog template.
    location ~ ^/(?<log_locale>en/)?apps/[a-z0-9]+(?:[.-][a-z0-9]+)+/changelog/?$ {
        try_files $uri $uri/index.html /${log_locale}apps/_changelog/index.html =404;
    }
    location ~ ^/(?<app_locale>en/)?apps/[a-z0-9]+(?:[.-][a-z0-9]+)+/?$ {
        try_files $uri $uri/index.html /${app_locale}apps/_detail/index.html =404;
    }
    # VitePress assets already have content hashes; regular entry files revalidate.
    location /docs/assets/ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/index.html $uri.html =404; }
}
